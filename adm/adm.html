<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importador IA - EMEC Baixada 2</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="../adm/style-admin.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Triagem de Relatórios com IA</h1>
            <p>A Inteligência Artificial vai ler, estruturar e salvar os dados na planilha</p>
        </header>
        
        <form id="formIA" class="app-form">
            <div class="whatsapp-box">
                <label>📋 Cole a mensagem do WhatsApp aqui:</label>
                <textarea id="txt_raw" rows="8" placeholder="Cole o texto do técnico exatamente como veio do grupo..." required></textarea>
            </div>

            <div id="status" class="status-msg"></div>

            <button type="submit" id="btnEnviar" class="btn-submit">Processar e Enviar com IA</button>
        </form>
        <form id="formIA">
            <textarea id="txt_raw" placeholder="Cole o relatório aqui..."></textarea>
            <button type="submit" id="btnEnviar">Processar com IA</button>
        </form>

        <div id="areaEdicao" style="display: none; margin-top: 20px;">
            <h3>Revise os dados antes de salvar:</h3>
            <div id="inputsEdicao">
        </div>
            <button id="btnSalvarFinal">Salvar na Planilha</button>
        </div>
    </div>

    <script src="../adm/jscript-adm.js"></script>
</body>
</html>
