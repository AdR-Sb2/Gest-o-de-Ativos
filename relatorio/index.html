<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório Técnico - Booster / Múltiplos Motores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Relatório de Manutenção</h1>
            <p>Preencha os parâmetros dos motores e dados de pressão da unidade.</p>
        </header>

        <form id="relatorioForm">
            <div class="section-block">
                <h2>1. Identificação da Infraestrutura</h2>
                <div class="form-group">
                    <label for="nomeBooster">Nome do Booster / Unidade *</label>
                    <input type="text" id="nomeBooster" value="BOOSTER JK" required>
                </div>
                <div class="form-group">
                    <label for="unidade">Unidade (EEAT/ETE) *</label>
                    <input type="text" id="unidade" value="ESTAÇÃO ELEVATÓRIA DE ÁGUA TRATADA (EEAT)0746 JK" required>
                </div>
                <div class="form-group">
                    <label for="endereco">Endereço Completo *</label>
                    <input type="text" id="endereco" value="R. da Cascata, 660 - Pres. Juscelino, Mesquita-rj" required>
                </div>
            </div>

            <div class="section-block">
                <h2>2. Parâmetros dos Motores</h2>
                
                <div class="motor-group">
                    <h3>MOTOR G1</h3>
                    <div class="form-group">
                        <label>Acionamento (Contatora/Soft/Inversor)</label>
                        <input type="text" id="acionamentoG1" value="INVERSOR DE FREQUÊNCIA SD750">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>RPM</label>
                            <input type="text" id="rpmG1" value="1793">
                        </div>
                        <div class="form-group">
                            <label>Potência</label>
                            <input type="text" id="potenciaG1" value="450CV">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tensão FF</label>
                            <input type="text" id="tensaoG1" value="440V">
                        </div>
                        <div class="form-group">
                            <label>Corrente Elétrica</label>
                            <input type="text" id="correnteG1" value="461/466A/462A">
                        </div>
                    </div>
                </div>

                <div class="motor-group">
                    <h3>MOTOR G2</h3>
                    <div class="form-group">
                        <label>Acionamento (Contatora/Soft/Inversor)</label>
                        <input type="text" id="acionamentoG2" value="INVERSOR DE FREQUÊNCIA SD750">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>RPM</label>
                            <input type="text" id="rpmG2" value="1790">
                        </div>
                        <div class="form-group">
                            <label>Potência</label>
                            <input type="text" id="potenciaG2" value="450CV">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tensão FF</label>
                            <input type="text" id="tensaoG2" value="440V">
                        </div>
                        <div class="form-group">
                            <label>Corrente Elétrica</label>
                            <input type="text" id="correnteG2" value="391/391A/385A">
                        </div>
                    </div>
                </div>

                <div class="motor-group">
                    <h3>MOTOR G4</h3>
                    <div class="form-group">
                        <label>Acionamento (Contatora/Soft/Inversor)</label>
                        <input type="text" id="acionamentoG4" value="INVERSOR DE FREQUÊNCIA SD750">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>RPM</label>
                            <input type="text" id="rpmG4" value="1790">
                        </div>
                        <div class="form-group">
                            <label>Potência</label>
                            <input type="text" id="potenciaG4" value="250CV">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tensão FF</label>
                            <input type="text" id="tensaoG4" value="220V - 380V - 440V">
                        </div>
                        <div class="form-group">
                            <label>Corrente Elétrica</label>
                            <input type="text" id="correnteG4" value="215A - 216A - 217A">
                        </div>
                    </div>
                </div>
            </div>

            <div class="section-block">
                <h2>3. Parâmetros Hidráulicos</h2>
                <div class="form-group">
                    <label for="retaguarda">Retaguarda (MCA)</label>
                    <input type="text" id="retaguarda" value="10MCA">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="recalqueVelho">Recalque: JK VELHO</label>
                        <input type="text" id="recalqueVelho" value="59MCA">
                    </div>
                    <div class="form-group">
                        <label for="recalqueNovo">Recalque: JK NOVO</label>
                        <input type="text" id="recalqueNovo" value="92MCA">
                    </div>
                </div>
            </div>

            <div class="section-block">
                <h2>4. Dados da Execução</h2>
                <div class="form-group">
                    <label for="servico">Serviço Executado *</label>
                    <textarea id="servico" rows="3" required>VERIFICAÇÃO DE FUNCIONAMENTO TESTE DE FUNCIONAMENTO</textarea>
                </div>
                <div class="form-group">
                    <label for="obs">Observações (Se houver)</label>
                    <input type="text" id="obs" placeholder="Ex: Deixado em automático">
                </div>
                <div class="form-group">
                    <label for="colaboradores">Colaboradores (Separados por barra ou vírgula) *</label>
                    <input type="text" id="colaboradores" value="Márcio/Diego" required>
                </div>
            </div>

            <div class="actions-stack">
                <button type="button" id="btnCopiarText" class="btn-copy">Copiar Texto do Relatório 📋</button>
                <button type="submit" id="btnWhats" class="btn-submit">Salvar Planilha + WhatsApp 🚀</button>
                <button type="button" class="btn-back" onclick="location.href='../index.html'">Voltar ao Menu</button>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
